<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
<defs>
<linearGradient id="carta" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#fdfbf7"/><stop offset="0.55" stop-color="#f6f1e7"/><stop offset="1" stop-color="#efe8da"/>
</linearGradient>
<radialGradient id="alone" cx="0.5" cy="0.44" r="0.6">
<stop offset="0" stop-color="#b99354" stop-opacity="0.18"/>
<stop offset="0.55" stop-color="#b99354" stop-opacity="0.06"/>
<stop offset="1" stop-color="#b99354" stop-opacity="0"/>
</radialGradient>
<pattern id="trat" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<line x1="0" y1="0" x2="0" y2="6" stroke="#8f6f3c" stroke-width="0.5" opacity="0.12"/>
</pattern>
</defs>
<rect width="800" height="600" fill="url(#carta)"/>
<rect width="800" height="600" fill="url(#alone)"/>

<!-- ACQUAFORTE: il contratto e la lente — la clausola che si legge da vicino -->
<!-- foglio -->
<path d="M250 120 L560 120 L560 520 L250 520 Z" fill="#f0e9db" stroke="#8f6f3c" stroke-width="1.5"/>
<path d="M250 120 L560 120 L560 520 L250 520 Z" fill="url(#trat)"/>
<path d="M268 138 L542 138 L542 502 L268 502 Z" fill="none" stroke="#8f6f3c" stroke-width="0.8" opacity="0.5"/>
<!-- righe di testo -->
<g stroke="#8f6f3c" stroke-width="2" opacity="0.45" stroke-linecap="round">
<line x1="292" y1="176" x2="520" y2="176"/>
<line x1="292" y1="204" x2="520" y2="204"/>
<line x1="292" y1="232" x2="474" y2="232"/>
<line x1="292" y1="286" x2="520" y2="286"/>
<line x1="292" y1="314" x2="520" y2="314"/>
<line x1="292" y1="342" x2="496" y2="342"/>
<line x1="292" y1="420" x2="520" y2="420"/>
<line x1="292" y1="448" x2="452" y2="448"/>
</g>
<!-- la clausola in evidenza (la riga "vessatoria") -->
<rect x="286" y="366" width="240" height="26" fill="#b99354" opacity="0.16"/>
<line x1="292" y1="379" x2="520" y2="379" stroke="#8f6f3c" stroke-width="2.6" opacity="0.75" stroke-linecap="round"/>

<!-- lente d'ingrandimento -->
<circle cx="470" cy="380" r="96" fill="#fdfbf7" opacity="0.55"/>
<circle cx="470" cy="380" r="96" fill="none" stroke="#8f6f3c" stroke-width="3.2"/>
<circle cx="470" cy="380" r="86" fill="none" stroke="#8f6f3c" stroke-width="0.9" opacity="0.55"/>
<!-- riga ingrandita dentro la lente -->
<line x1="404" y1="374" x2="536" y2="374" stroke="#8f6f3c" stroke-width="5" opacity="0.85" stroke-linecap="round"/>
<line x1="404" y1="396" x2="500" y2="396" stroke="#8f6f3c" stroke-width="5" opacity="0.55" stroke-linecap="round"/>
<!-- impugnatura -->
<line x1="538" y1="448" x2="606" y2="516" stroke="#8f6f3c" stroke-width="11" stroke-linecap="round"/>
<line x1="538" y1="448" x2="606" y2="516" stroke="#f0e9db" stroke-width="4" stroke-linecap="round" opacity="0.5"/>

<!-- filetto d'oro di base, come nelle altre tavole -->
<line x1="180" y1="556" x2="620" y2="556" stroke="#b99354" stroke-width="2" opacity="0.6"/>
</svg>
