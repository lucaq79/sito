<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<!-- SICUREZZA — su GitHub Pages non si possono impostare intestazioni HTTP:
     le direttive esprimibili via meta sono riportate qui. Il file _headers,
     che valeva solo per Netlify, è stato rimosso perché inerte. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://gc.zgo.at; img-src 'self' data: https://avvocatolucaquartapelle.goatcounter.com; font-src 'self'; connect-src 'self' https://avvocatolucaquartapelle.goatcounter.com; base-uri 'self'; form-action 'self'; object-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagina non trovata — Avv. Luca Quartapelle</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#0a1a33">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<style>
@font-face{font-family:"Source Serif";src:url("SourceSerif4-Medium.woff2") format("woff2");font-weight:300 500;font-style:normal;font-display:swap}
@font-face{font-family:"Source Serif";src:url("SourceSerif4-Semibold.woff2") format("woff2");font-weight:600 800;font-style:normal;font-display:swap}

/* Pagina mostrata quando un indirizzo non esiste. Netlify la usa da sola,
   purché il file si chiami esattamente 404.html e stia nella cartella del sito. */
:root{
  --navy:#0a1a33; --navy-3:#143263;
  --oro:#b99354; --oro-l:#d4b479;
  --avorio:#f3efe8;
  --display:"Source Serif",Constantia,"Palatino Linotype",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
::selection{background:var(--oro);color:var(--navy)}
html,body{height:100%}
body{
  font-family:var(--sans);color:var(--avorio);line-height:1.7;-webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;text-align:center;padding:32px;
  background:radial-gradient(110% 90% at 70% 12%,rgba(185,147,84,.20) 0%,rgba(185,147,84,0) 62%),
             linear-gradient(168deg,#0d2144 0%,#0a1a33 50%,#06111f 100%)
}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--oro);outline-offset:3px}
.q{max-width:620px}
.marchio{display:block;margin:0 auto 3rem;max-width:280px}
.marchio svg{width:100%;height:auto;display:block}
.cod{font-family:var(--display);font-size:clamp(3.4rem,11vw,6rem);color:var(--oro-l);line-height:1;letter-spacing:.04em}
h1{font-family:var(--display);font-weight:400;font-size:clamp(1.5rem,4vw,2.2rem);line-height:1.2;margin:1.4rem 0 1rem}
p{color:rgba(243,239,232,.72);font-size:1rem;max-width:46ch;margin:0 auto}
.filo-oro{width:56px;height:1px;background:var(--oro);margin:2.2rem auto}
.azioni{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.bott{display:inline-block;font-weight:600;font-size:.76rem;letter-spacing:.16em;text-transform:uppercase;padding:1.02rem 2rem;transition:.3s;border:1px solid transparent}
.bott.oro{background:var(--oro);color:var(--navy)}
.bott.oro:hover{background:var(--oro-l)}
.bott.linea{border-color:rgba(243,239,232,.45);color:var(--avorio)}
.bott.linea:hover{border-color:var(--oro);color:var(--oro-l)}
</style>
</head>

<body>
<main class="q">
  <a class="marchio" href="/" aria-label="Luca Quartapelle — Avvocato">
    <svg viewBox="0 0 300 124" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Luca Quartapelle, Avvocato">
      <g fill="#f3efe8" font-family="Georgia,'Times New Roman',serif">
        <text x="0"  y="58"  font-size="68">L</text>
        <text x="44" y="46"  font-size="31" textLength="76"  lengthAdjust="spacingAndGlyphs">UCA</text>
        <text x="22" y="110" font-size="68">Q</text>
        <text x="70" y="96"  font-size="31" textLength="222" lengthAdjust="spacingAndGlyphs">UARTAPELLE</text>
        <text x="292" y="122" font-size="15" letter-spacing="4" text-anchor="end">AVVOCATO</text>
      </g>
      <line x1="70" y1="104" x2="292" y2="104" stroke="#b99354" stroke-width="2"/>
    </svg>
  </a>

  <div class="cod">404</div>
  <h1>Questa pagina non esiste</h1>
  <p>L'indirizzo digitato non corrisponde ad alcuna pagina del sito. Può darsi sia stato modificato, oppure che vi sia un errore di battitura.</p>

  <div class="filo-oro" aria-hidden="true"></div>

  <div class="azioni">
    <a class="bott oro" href="/">Torna alla pagina iniziale</a>
    <a class="bott linea" href="tel:+3908611886417">0861 1886417</a>
  </div>
</main>
</body>
</html>
