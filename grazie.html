<style>
@font-face{font-family:"Source Serif";src:url("SourceSerif4-Medium.woff2") format("woff2");font-weight:300 500;font-style:normal;font-display:swap}
@font-face{font-family:"Source Serif";src:url("SourceSerif4-Semibold.woff2") format("woff2");font-weight:600 800;font-style:normal;font-display:swap}

/* Pagina di cortesia dopo l'invio del modulo — stessa veste del sito. */
:root{
  --navy:#0a1a33; --oro:#b99354; --oro-l:#d4b479; --avorio:#f3efe8;
  --display:"Source Serif",Constantia,"Palatino Linotype",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:linear-gradient(168deg,#0d2144 0%,#0a1a33 52%,#06111f 100%);color:var(--avorio);min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;line-height:1.7;padding:28px}
a{color:inherit;text-decoration:none}
.scheda{max-width:560px;text-align:center}
.filo{width:56px;height:1px;background:var(--oro);margin:0 auto 1.6rem}
h1{font-family:var(--display);font-weight:400;font-size:clamp(1.7rem,4.5vw,2.4rem);line-height:1.15;margin-bottom:1rem}
p{color:rgba(243,239,232,.78);font-size:.95rem;margin-bottom:.8rem}
.azioni{margin-top:1.8rem;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.bott{display:inline-block;font-weight:600;font-size:.76rem;letter-spacing:.16em;text-transform:uppercase;padding:1rem 1.9rem;transition:.3s;border:1px solid transparent}
.bott.oro{background:var(--oro);color:var(--navy)}
.bott.oro:hover{background:var(--oro-l)}
.bott.linea{border-color:rgba(243,239,232,.45);color:var(--avorio)}
.bott.linea:hover{border-color:var(--oro);color:var(--oro-l)}
:focus-visible{outline:3px solid var(--oro);outline-offset:3px}
</style>
</head>
<body>
<main class="scheda">
  <div class="filo"></div>
  <h1>Il messaggio è stato ricevuto</h1>
  <p>Lo Studio darà riscontro dopo la verifica preliminare sull'insussistenza di conflitto di interessi.</p>
  <p>Se il caso presenta termini pendenti — un atto notificato, una scadenza vicina — è preferibile telefonare direttamente.</p>
  <div class="azioni">
    <a class="bott oro" href="tel:+3908611886417">0861 1886417</a>
    <a class="bott linea" href="index.html">Tornare al sito</a>
  </div>
</main>
<!-- AVVISO SUI COOKIE — marcatura e stile in chiaro: l'avviso compare anche
     se consenso.js non venisse caricato. Istruzioni in testa a quel file. -->
<div id="ck-avviso" hidden></div>
<script src="consenso.js" defer></script>
<script data-goatcounter="https://avvocatolucaquartapelle.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
